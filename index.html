<style>
:root{color-scheme:dark;--bg:#0b0714;--panel:#120c20;--card:#191127;--raised:#211635;--purple:#9b5cff;--lav:#d8c2ff;--text:#f7f2ff;--muted:#a99dbd;--line:#38264f;--green:#42d6a4;--amber:#f5bc62;--red:#ff6b87}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#291448 0,transparent 36%),var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:10px;padding:10px 13px}button:hover{border-color:var(--purple)}button.primary{background:linear-gradient(135deg,#9b5cff,#7540ce);border:0;font-weight:700}button.ghost{background:transparent}.app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr)}aside{background:#100a1b;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;gap:24px}.brand{padding:0 10px}.brandmark{font-weight:900;font-size:23px;letter-spacing:1px}.brandmark span{color:var(--purple)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px;margin-top:3px}.navlabel{color:#77688e;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:0 12px;margin-bottom:5px}.nav{display:grid;gap:5px}.nav button{display:flex;gap:11px;align-items:center;text-align:left;background:transparent;border-color:transparent;color:var(--muted);padding:11px 12px}.nav button.active{background:#2a1941;color:#fff;border-color:#4b2c70}.nav .ico{width:21px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;background:var(--card);border:1px solid var(--line);padding:13px;border-radius:13px;color:var(--muted);font-size:12px}.sidefoot strong{color:var(--lav);display:block;margin-bottom:4px}main{min-width:0;padding:28px clamp(16px,3vw,40px) 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.eyebrow{font-size:11px;color:var(--lav);letter-spacing:1.8px;font-weight:800}.topright{display:flex;align-items:center;gap:10px}.select, input, textarea, select{background:#100a1b;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 11px;min-width:0;width:100%}.topright select{width:auto;max-width:180px}.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:800;border:1px solid #6d4b20;background:#322414;color:#ffcf83}.status.live{border-color:#1c614e;background:#112b25;color:#75edc1}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:22px}.pagehead h1{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:5px 0 7px;letter-spacing:-.8px}.sub{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:15px}.metric,.panel,.finance{background:linear-gradient(145deg,#1d142b,#151020);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.metrichead{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.metricicon{display:grid;place-items:center;width:33px;height:33px;border-radius:10px;background:#32204a;color:var(--lav);font-size:16px}.number{font-size:29px;font-weight:800;letter-spacing:-.7px;margin:14px 0 2px}.hint{color:var(--muted);font-size:11px}.finances{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.finance{background:linear-gradient(135deg,#26173a,#181025);position:relative;overflow:hidden}.finance:after{content:'';position:absolute;width:100px;height:100px;border-radius:50%;background:#9b5cff0c;right:-25px;top:-30px}.finance .label{font-size:12px;color:var(--muted)}.finance .number{font-size:26px;margin:9px 0}.finance .hint{max-width:90%}.sectiongrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);gap:15px}.panel h2{font-size:15px;margin:0 0 4px}.panelhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:17px}.panelhead p{margin:0;color:var(--muted);font-size:12px}.progressrow{margin:17px 0}.progresslabels{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:8px}.progresslabels span:last-child{color:var(--muted)}.bar{height:7px;border-radius:99px;background:#342543;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7841d2,#bd9aff)}.empty{border:1px dashed #4a3561;border-radius:12px;padding:24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.listrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #30213f}.listrow:last-child{border-bottom:0}.avatar{width:35px;height:35px;flex:0 0 35px;border-radius:11px;background:linear-gradient(135deg,#7040a7,#2e1d47);display:grid;place-items:center;font-weight:800;color:#fff}.grow{flex:1;min-width:0}.grow strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.grow small{color:var(--muted);font-size:11px}.tag{font-size:10px;border-radius:99px;padding:4px 7px;background:#182e28;color:#72e9bc;border:1px solid #24533f;white-space:nowrap}.tag.warn{background:#302314;color:#f7c578;border-color:#67491e}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:150px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:680px;background:#130d1f}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #30213f;font-size:12px;white-space:nowrap}th{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);background:#1b1228}tr:last-child td{border-bottom:0}.pill{border-radius:99px;padding:4px 7px;font-size:10px;background:#302314;color:#f7c578}.pill.good{background:#122d25;color:#70e7b9}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px;color:var(--muted);font-size:12px}.field.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#05030bd9;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modalback.open{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#171023;border:1px solid #4a3264;border-radius:18px;padding:22px;box-shadow:0 25px 80px #0009}.modal h2{margin:0 0 5px}.modal p{color:var(--muted);font-size:12px;margin:0 0 20px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{border:1px solid #644b24;background:#2b2116;color:#f6d39a;padding:12px;border-radius:11px;font-size:12px;margin-bottom:16px}.hidden{display:none!important}.mobilebrand{display:none}.footnote{font-size:11px;color:var(--muted);margin-top:14px}.rewardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.rewardbox{background:#160f22;border:1px solid var(--line);padding:15px;border-radius:12px}.rewardbox b{display:block;font-size:20px;color:var(--lav)}.rewardbox small{color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:190px minmax(0,1fr)}aside{padding:20px 10px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.sectiongrid{grid-template-columns:1fr}.finances{grid-template-columns:1fr}.finance{padding:15px}.finance .number{font-size:23px}}@media(max-width:620px){.app{display:block}aside{position:sticky;top:0;z-index:5;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:10px}.brand{display:flex;align-items:center;justify-content:space-between;padding:0 4px}.brandmark{font-size:20px}.brand small{font-size:8px}.navlabel,.sidefoot{display:none}.nav{display:flex;overflow:auto;gap:5px;padding-bottom:1px}.nav button{flex:0 0 auto;padding:8px 10px;font-size:11px;gap:6px}.nav .ico{width:auto}main{padding:19px 13px 45px}.topbar{margin-bottom:20px}.topbar .eyebrow{font-size:9px}.topright{gap:6px}.topright select{max-width:125px;font-size:11px;padding:8px}.topright .status{font-size:9px;padding:5px 7px}.pagehead{align-items:start;flex-direction:column}.pagehead h1{font-size:27px}.metrics{gap:9px}.metric{padding:13px}.number{font-size:25px}.metricicon{width:28px;height:28px}.finances{gap:9px}.finance .number{font-size:23px}.panel{padding:14px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.rewardgrid{grid-template-columns:1fr}.toolbar button{flex:1}.actions button{flex:1}}
</style></head>
<body><div class="app"><aside><div class="brand"><div><div class="brandmark">LIVE<span> HQ</span></div><small>SEMII SOUNDS · SELF MADE AGENCY</small></div></div><div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-page="Overview"><span class="ico">◈</span>Overview</button><button data-page="Recruiters"><span class="ico">♙</span>Recruiters</button><button data-page="Creators"><span class="ico">♫</span>Creators</button><button data-page="Hours & Pay"><span class="ico">▤</span>Hours & Pay</button><button data-page="Goals"><span class="ico">◎</span>Goals</button><button data-page="Rewards"><span class="ico">✧</span>Rewards</button><button data-page="Previous Months"><span class="ico">◷</span>Previous Months</button><button data-page="Settings"><span class="ico">⚙</span>Settings</button></nav></div><div class="sidefoot"><strong>✦ Your agency workspace</strong>Demo records stay in this browser until you export them. Cloud sync is not connected.</div></aside><main><div class="topbar"><div><div class="eyebrow">AGENCY CONTROL CENTER</div></div><div class="topright"><span id="dataStatus" class="status">DEMO DATA</span><select id="monthSelect" aria-label="Select month"></select></div></div><div id="pageContent"></div></main></div>
<div class="modalback" id="modalBack"><div class="modal"><h2 id="modalTitle">Add record</h2><p id="modalSub">Enter details below.</p><form id="recordForm"><div class="formgrid" id="formFields"></div><div class="modalactions"><button type="button" id="cancelModal">Cancel</button><button class="primary" type="submit">Save record</button></div></form></div></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const currentMonth=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};const monthLabel=m=>{if(!m)return'';let [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})};let state={page:'Overview',month:currentMonth(),recruiters:[],creators:[],stats:{},rewards:[],archives:{},settings:{days:15,hours:30,minDiamonds:10000,agencyGoal:1000000,creatorGoal:10,recruiterGoal:3,tiers:[]},demo:true};const key='livehq-starter-v1';function load(){try{let s=JSON.parse(localStorage.getItem(key)||'null');if(s&&s.recruiters&&s.creators){state={...state,...s,demo:false};$('#dataStatus').textContent='LOCAL DATA · THIS DEVICE';$('#dataStatus').classList.add('live')}}catch(e){console.warn(e)}}function save(){try{localStorage.setItem(key,JSON.stringify({...state,demo:false}));state.demo=false;$('#dataStatus').textContent='LOCAL DATA · THIS DEVICE';$('#dataStatus').classList.add('live');return true}catch(e){alert('Could not save in this browser. Export your data as a backup.');return false}}function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0)}function num(n){return new Intl.NumberFormat('en-US').format(Number(n)||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function statsFor(id,m=state.month){return state.stats[`${m}:${id}`]||{days:0,hours:0,diamonds:0}}function qualified(id,m=state.month){let s=statsFor(id,m);return s.days>=Number(state.settings.days)&&s.hours>=Number(state.settings.hours)&&s.diamonds>=Number(state.settings.minDiamonds)}function percent(v,t){return Math.max(0,Math.min(100,t?Number(v)/Number(t)*100:0))}function creatorSalary(c,m=state.month){if(!qualified(c.id,m))return 0;let s=statsFor(c.id,m);let tiers=[...(state.settings.tiers||[])].filter(t=>Number(s.diamonds)>=Number(t.min)).sort((a,b)=>Number(b.min)-Number(a.min));return tiers.length?Number(tiers[0].pay)||0:0}function rewardFor(c,m=state.month){let d=statsFor(c.id,m).diamonds;let tiers=[{min:1000000,type:'cash',cash:300,recharge:330},{min:750000,type:'cash',cash:250,recharge:275},{min:500000,type:'cash',cash:150,recharge:165},{min:350000,type:'cash',cash:150,recharge:165},{min:200000,type:'cash',cash:100,recharge:110},{min:100000,type:'cash',cash:50,recharge:55},{min:50000,type:'diamonds',cash:2000,recharge:0}];let t=tiers.find(t=>d>=t.min);return t?{...t,diamonds:d}:null}function assigned(c){return state.recruiters.find(r=>r.id===c.recruiterId)}function creatorName(c){return c.name||c.liveId||'Unnamed creator'}function allStats(m=state.month){return state.creators.reduce((a,c)=>{let s=statsFor(c.id,m);a.diamonds+=Number(s.diamonds)||0;if(qualified(c.id,m))a.qualified++;a.salary+=creatorSalary(c,m);return a},{diamonds:0,qualified:0,salary:0})}function populateMonths(){let list=new Set([currentMonth(),state.month,...Object.keys(state.archives||{}),...Object.keys(state.stats||{}).map(k=>k.split(':')[0])]);$('#monthSelect').innerHTML=[...list].sort().reverse().map(m=>`<option value="${esc(m)}" ${m===state.month?'selected':''}>${esc(monthLabel(m))}</option>`).join('')}function statusTag(ok,text){return `<span class="tag ${ok?'':'warn'}">${text}</span>`}function metric(label,value,icon,hint){return `<div class="metric"><div class="metrichead"><span>${label}</span><span class="metricicon">${icon}</span></div><div class="number">${value}</div><div class="hint">${hint}</div></div>`}function progress(label,v,t,format='number'){let p=percent(v,t);let val=format==='money'?money(v):format==='diamonds'?num(v):num(v);let target=format==='money'?money(t):num(t);return `<div class="progressrow"><div class="progresslabels"><span>${label}</span><span>${val} / ${target} · ${Math.round(p)}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}function pageHead(title,sub,buttons=''){return `<div class="pagehead"><div><div class="eyebrow">${state.page==='Overview'?'YOUR AGENCY, AT A GLANCE':'LIVE HQ WORKSPACE'}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${buttons}</div></div>`}function render(){populateMonths();$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));let fn={'Overview':overview,'Recruiters':recruitersPage,'Creators':creatorsPage,'Hours & Pay':payPage,'Goals':goalsPage,'Rewards':rewardsPage,'Previous Months':archivesPage,'Settings':settingsPage}[state.page]||overview;$('#pageContent').innerHTML=fn();bindPage();}function overview(){let a=allStats(),rewards=state.creators.reduce((sum,c)=>{let r=rewardFor(c);return sum+(r&&r.type==='cash'?r.cash:0)},0);let qualifiedList=state.creators.filter(c=>qualified(c.id));let closest=state.creators.filter(c=>!qualified(c.id)).map(c=>({c,s:statsFor(c.id)})).sort((x,y)=>y.s.diamonds-x.s.diamonds).slice(0,4);return `${pageHead('Agency at a Glance',`Your agency performance, creator qualification, and earnings for ${monthLabel(state.month)}.`,`<button class="primary" data-action="add-creator">＋ Add Creator</button><button data-action="add-recruiter">＋ Add Recruiter</button>`)}<div class="metrics">${metric('Recruiters',num(state.recruiters.filter(r=>r.active!==false).length),'♙','Active recruiter accounts')}${metric('Creators',num(state.creators.filter(c=>c.active!==false).length),'♫','In your agency directory')}${metric('Diamonds',num(a.diamonds),'✧','Earned in selected month')}${metric('Qualified Creators',`${a.qualified} / ${state.creators.length}`,'✓','Met days, hours and diamonds')}</div><div class="finances"><div class="finance"><div class="label">Estimated Agency Salary</div><div class="number">${money(a.salary)}</div><div class="hint">Based on configured salary tiers and eligible creators. Confirm actual rates in Settings.</div></div><div class="finance"><div class="label">Recruiter Rewards</div><div class="number">${money(rewards)}</div><div class="hint">Indicative cash rewards at the highest matched listed milestone per creator.</div></div><div class="finance"><div class="label">Payouts Awaiting Verification</div><div class="number">${money(a.salary+rewards)}</div><div class="hint">Estimate only. This starter does not verify or process payments.</div></div></div><div class="sectiongrid"><section class="panel"><div class="panelhead"><div><h2>Monthly Performance</h2><p>Agency-wide progress for ${esc(monthLabel(state.month))}</p></div>${statusTag(a.qualified===state.creators.length&&state.creators.length>0,'LIVE VIEW')}</div>${progress('Agency diamonds goal',a.diamonds,state.settings.agencyGoal,'diamonds')}${progress('Qualified creators goal',a.qualified,state.settings.creatorGoal)}${progress('Recruitment goal',state.recruiters.length,state.settings.recruiterGoal)}<div class="footnote">Goals and salary tiers are editable in Settings. Qualification defaults: ${state.settings.days} days, ${state.settings.hours} hours, ${num(state.settings.minDiamonds)} diamonds.</div></section><section class="panel"><div class="panelhead"><div><h2>Creator Qualification</h2><p>Closest creators to qualifying</p></div><button class="ghost" data-goto="Creators">View all ↗</button></div>${closest.length?closest.map(({c,s})=>`<div class="listrow"><div class="avatar">${esc(creatorName(c).slice(0,1).toUpperCase())}</div><div class="grow"><strong>${esc(creatorName(c))}</strong><small>${num(s.diamonds)} diamonds · ${s.days}/${state.settings.days} days · ${s.hours}/${state.settings.hours} hrs</small></div>${statusTag(false,Math.max(0,state.settings.minDiamonds-s.diamonds).toLocaleString()+' left')}</div>`).join(''):`<div class="empty"><strong>No creator records yet</strong>Add a creator to start tracking monthly progress.</div>`}</section></div><div class="panel" style="margin-top:15px"><div class="panelhead"><div><h2>Recently Added Creators</h2><p>Quick view of your creator directory</p></div><button data-goto="Creators">Open Creators ↗</button></div>${state.creators.length?`<div class="tablewrap"><table><thead><tr><th>Creator</th><th>LiveMe ID</th><th>Recruiter</th><th>Diamonds</th><th>Qualification</th></tr></thead><tbody>${state.creators.slice(-5).reverse().map(c=>{let s=statsFor(c.id);return `<tr><td>${esc(creatorName(c))}</td><td>${esc(c.liveId||'—')}</td><td>${esc(assigned(c)?.name||'Unassigned')}</td><td>${num(s.diamonds)}</td><td>${qualified(c.id)?'<span class="pill good">Qualified</span>':'<span class="pill">In progress</span>'}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><strong>Your dashboard is ready</strong>These figures will update as you add real records in this browser.</div>`}</div>`}function recruitersPage(){return `${pageHead('Recruiters','Manage your team, assignments, and monthly performance.','<button class="primary" data-action="add-recruiter">＋ Add Recruiter</button>')}<div class="toolbar"><input id="searchTable" placeholder="Search recruiter name or ID…"><button data-action="export">Export CSV</button></div><div id="tableSlot"></div>`}function creatorsPage(){return `${pageHead('Creators','Track LiveMe IDs, recruiter assignments, and monthly qualification.','<button class="primary" data-action="add-creator">＋ Add Creator</button>')}<div class="toolbar"><input id="searchTable" placeholder="Search creator name or LiveMe ID…"><select id="filterStatus"><option value="all">All statuses</option><option value="qualified">Qualified</option><option value="progress">In progress</option><option value="inactive">Inactive</option></select><select id="filterRecruiter"><option value="all">All recruiters</option>${state.recruiters.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select><button data-action="export">Export CSV</button></div><div id="tableSlot"></div>`}function payPage(){return `${pageHead('Hours & Pay','Review monthly performance and estimated agency salary.','<button data-action="export">Export CSV</button>')}<div class="notice">Salary figures are estimates until you confirm the correct agency pay tiers in Settings. This app does not process payouts.</div><div id="tableSlot"></div>`}function goalsPage(){let a=allStats();return `${pageHead('Goals','Agency targets, actual performance, and remaining milestones.','<button data-goto="Settings">Edit goals ↗</button>')}<div class="metrics">${metric('Diamond Target',num(state.settings.agencyGoal),'✧','Monthly agency goal')}${metric('Qualified Target',num(state.settings.creatorGoal),'✓','Creators to qualify')}${metric('Recruitment Target',num(state.settings.recruiterGoal),'♙','Recruiters target')}${metric('Diamonds Remaining',num(Math.max(0,state.settings.agencyGoal-a.diamonds)),'↗','To reach agency target')}</div><div class="panel">${progress('Agency diamonds',a.diamonds,state.settings.agencyGoal,'diamonds')}${progress('Qualified creators',a.qualified,state.settings.creatorGoal)}${progress('Recruiters',state.recruiters.length,state.settings.recruiterGoal)}<p class="footnote">Agency goals are separate from individual creator qualification and recruiter reward milestones.</p></div>`}function rewardsPage(){let rows=state.creators.map(c=>({c,r:rewardFor(c)})).filter(x=>x.r);return `${pageHead('Recruiter Rewards','Milestones matched to creator diamond totals.','<button data-action="export">Export CSV</button>')}<div class="notice">Reward schedule: 50K = 2,000 diamonds; 100K = $50 or $55 recharge; 200K = $100 or $110; 350K = $150 or $165; 500K = $150 or $165; 750K = $250 or $275; 1M = $300 or $330. Confirm your payout interpretation before using this for actual payments.</div><div class="rewardgrid"><div class="rewardbox"><small>Creators at listed milestones</small><b>${rows.length}</b></div><div class="rewardbox"><small>Indicative cash rewards</small><b>${money(rows.filter(x=>x.r.type==='cash').reduce((s,x)=>s+x.r.cash,0))}</b></div><div class="rewardbox"><small>Reward records</small><b>${state.rewards.length}</b><small>Manual verification status</small></div></div><div class="panel" style="margin-top:15px"><div class="panelhead"><div><h2>Milestone Review</h2><p>Highest listed milestone matched per creator, not cumulative.</p></div></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Creator</th><th>Recruiter</th><th>Diamonds</th><th>Milestone</th><th>Reward option</th><th>Status</th></tr></thead><tbody>${rows.map(({c,r})=>`<tr><td>${esc(creatorName(c))}</td><td>${esc(assigned(c)?.name||'Unassigned')}</td><td>${num(r.diamonds)}</td><td>${num(r.min)}</td><td>${r.type==='diamonds'?`${num(r.cash)} diamonds`:`${money(r.cash)} cash / ${money(r.recharge)} recharge`}</td><td><span class="pill">Needs verification</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>No milestones reached yet</strong>Creator reward milestones will appear here when diamond totals match a listed tier.</div>`}</div>`}function archivesPage(){let keys=Object.keys(state.archives||{}).sort().reverse();return `${pageHead('Previous Months','Historical snapshots stay separate from the current month.','<button data-action="archive">Archive selected month</button>')}<div class="notice">This starter does not yet run a secure cloud-based automatic rollover. Archive a month manually before changing months. Each snapshot stores the visible figures and settings.</div>${keys.length?keys.map(m=>{let a=state.archives[m];return `<div class="panel" style="margin-bottom:12px"><div class="panelhead"><div><h2>${esc(monthLabel(m))}</h2><p>Archived snapshot · ${esc(a.savedAt||'')}</p></div><button data-action="view-archive" data-month="${esc(m)}">View snapshot</button></div><div class="metrics" style="margin:0">${metric('Creators',num(a.creatorCount),'♫','At archive time')}${metric('Diamonds',num(a.diamonds),'✧','Recorded total')}${metric('Qualified',num(a.qualified),'✓','At archive time')}${metric('Est. salary',money(a.salary),'＄','Snapshot estimate')}</div></div>`}).join(''):`<div class="empty"><strong>No archived months yet</strong>Choose “Archive selected month” to save a snapshot before starting a new month.</div>`}`}function settingsPage(){return `${pageHead('Settings','Configure qualification, goals, salary tiers, and backups.','<button class="primary" data-action="save-settings">Save Settings</button>')}<div class="notice">Current version saves records in this browser only. It is not yet a secure multi-user cloud app. Use Export Backup regularly. Do not enter sensitive creator information until cloud authentication and access rules are implemented.</div><div class="sectiongrid"><section class="panel"><h2>Qualification Rules</h2><p class="sub" style="margin:5px 0 18px">A creator must meet all three requirements.</p><div class="formgrid"><label class="field">Effective days required<input id="setDays" type="number" min="0" value="${state.settings.days}"></label><label class="field">Broadcast hours required<input id="setHours" type="number" min="0" value="${state.settings.hours}"></label><label class="field full">Minimum diamonds<input id="setDiamonds" type="number" min="0" value="${state.settings.minDiamonds}"></label></div><h2 style="margin-top:25px">Agency Goals</h2><div class="formgrid" style="margin-top:12px"><label class="field">Monthly diamonds goal<input id="setAgencyGoal" type="number" min="0" value="${state.settings.agencyGoal}"></label><label class="field">Qualified creator goal<input id="setCreatorGoal" type="number" min="0" value="${state.settings.creatorGoal}"></label><label class="field full">Recruiter goal<input id="setRecruiterGoal" type="number" min="0" value="${state.settings.recruiterGoal}"></label></div></section><section class="panel"><h2>Agency Salary Tiers</h2><p class="sub" style="margin:5px 0 15px">Unconfirmed rates: add only the amounts you have verified.</p><div id="tierList">${(state.settings.tiers||[]).map((t,i)=>`<div class="listrow"><div class="grow"><strong>${num(t.min)} diamonds</strong><small>${money(t.pay)} agency pay</small></div><button data-action="remove-tier" data-index="${i}">Remove</button></div>`).join('')||'<div class="empty">No confirmed salary tiers added.</div>'}</div><form id="tierForm" style="margin-top:15px"><div class="formgrid"><label class="field">Minimum diamonds<input name="min" type="number" min="0" required placeholder="e.g. 50000"></label><label class="field">Agency pay ($)<input name="pay" type="number" min="0" step="0.01" required placeholder="Enter verified rate"></label></div><button class="primary" style="margin-top:12px" type="submit">＋ Add salary tier</button></form><h2 style="margin-top:26px">Data & Backup</h2><p class="sub" style="margin:5px 0 14px">Export a JSON backup to keep a copy of records.</p><div class="actions"><button data-action="backup">Export Backup JSON</button><button data-action="restore">Import Backup JSON</button><button data-action="csv-all">Export CSV</button><input class="hidden" type="file" id="backupFile" accept="application/json,.json"></div><p class="footnote">Month archive is manual in this prototype. Cloud sync, user logins, and secure recruiter permissions still need to be added.</p></section></div>`}function renderTable(){let slot=$('#tableSlot');if(!slot)return;let q=($('#searchTable')?.value||'').toLowerCase();if(state.page==='Recruiters'){let rows=state.recruiters.filter(r=>(r.name+' '+(r.username||'')+' '+(r.contact||'')).toLowerCase().includes(q));slot.innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Recruiter</th><th>Contact / ID</th><th>Creators</th><th>Diamonds</th><th>Qualified</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>{let cs=state.creators.filter(c=>c.recruiterId===r.id),d=cs.reduce((s,c)=>s+Number(statsFor(c.id).diamonds),0),qual=cs.filter(c=>qualified(c.id)).length;return `<tr><td>${esc(r.name)}</td><td>${esc(r.username||r.contact||'—')}</td><td>${cs.length}</td><td>${num(d)}</td><td>${qual}</td><td>${r.active===false?'<span class="pill">Inactive</span>':'<span class="pill good">Active</span>'}</td><td><button data-action="edit-recruiter" data-id="${r.id}">Edit</button> <button data-action="toggle-recruiter" data-id="${r.id}">${r.active===false?'Activate':'Deactivate'}</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><strong>No recruiters found</strong>Add a recruiter or change your search.</div>`}else if(state.page==='Creators'||state.page==='Hours & Pay'){let rows=state.creators.filter(c=>{let s=statsFor(c.id),status=$('#filterStatus')?.value||'all',rec=$('#filterRecruiter')?.value||'all';return (creatorName(c)+' '+(c.liveId||'')).toLowerCase().includes(q)&&(status==='all'||(status==='qualified'&&qualified(c.id))||(status==='progress'&&!qualified(c.id))||(status==='inactive'&&c.active===false))&&(rec==='all'||c.recruiterId===rec)});slot.innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Creator</th><th>LiveMe ID</th><th>Recruiter</th><th>Days</th><th>Hours</th><th>Diamonds</th><th>Qualification</th><th>${state.page==='Hours & Pay'?'Est. salary':'Actions'}</th></tr></thead><tbody>${rows.map(c=>{let s=statsFor(c.id),ok=qualified(c.id);return `<tr><td>${esc(creatorName(c))}</td><td>${esc(c.liveId||'—')}</td><td>${esc(assigned(c)?.name||'Unassigned')}</td><td>${num(s.days)} / ${state.settings.days}</td><td>${num(s.hours)} / ${state.settings.hours}</td><td>${num(s.diamonds)}</td><td>${ok?'<span class="pill good">Qualified</span>':'<span class="pill">In progress</span>'}</td><td>${state.page==='Hours & Pay'?money(creatorSalary(c)):`<button data-action="edit-creator" data-id="${c.id}">Edit</button> <button data-action="edit-stats" data-id="${c.id}">Update month</button>`}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><strong>No creators found</strong>Add a creator or change your filters.</div>`}}function bindPage(){renderTable();$$('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b.dataset.id,b.dataset.month,b.dataset.index)));$$('[data-goto]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.goto)));$('#searchTable')?.addEventListener('input',renderTable);$('#filterStatus')?.addEventListener('change',renderTable);$('#filterRecruiter')?.addEventListener('change',renderTable);$('#tierForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);state.settings.tiers.push({min:Number(f.get('min')),pay:Number(f.get('pay'))});state.settings.tiers.sort((a,b)=>a.min-b.min);save();render()});$('#recordForm').onsubmit=saveModal}function go(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('#monthSelect').addEventListener('change',e=>{let old=state.month;state.month=e.target.value;if(state.month!==old&&!state.archives[old]){let ok=confirm(`You changed from ${monthLabel(old)} to ${monthLabel(state.month)}. Archive ${monthLabel(old)} now before moving on?`);if(ok)archiveMonth(old)}save();render()});function action(a,id,month,index){if(a==='add-creator')openModal('creator');if(a==='add-recruiter')openModal('recruiter');if(a==='edit-creator')openModal('creator',id);if(a==='edit-recruiter')openModal('recruiter',id);if(a==='edit-stats')openModal('stats',id);if(a==='toggle-recruiter'){let r=state.recruiters.find(x=>x.id===id);if(r){r.active=r.active===false;save();render()}}if(a==='export'||a==='csv-all')exportCSV();if(a==='save-settings'){state.settings.days=Number($('#setDays').value)||0;state.settings.hours=Number($('#setHours').value)||0;state.settings.minDiamonds=Number($('#setDiamonds').value)||0;state.settings.agencyGoal=Number($('#setAgencyGoal').value)||0;state.settings.creatorGoal=Number($('#setCreatorGoal').value)||0;state.settings.recruiterGoal=Number($('#setRecruiterGoal').value)||0;save();render();alert('Settings saved in this browser.')}if(a==='remove-tier'){state.settings.tiers.splice(Number(index),1);save();render()}if(a==='archive'){if(confirm(`Save a snapshot of ${monthLabel(state.month)}?`)){archiveMonth(state.month);save();render()}}if(a==='view-archive'){let ar=state.archives[month];alert(`${monthLabel(month)} snapshot\nCreators: ${ar.creatorCount}\nDiamonds: ${num(ar.diamonds)}\nQualified: ${ar.qualified}\nEstimated salary: ${money(ar.salary)}\nSaved: ${ar.savedAt}`)}if(a==='backup')backup();if(a==='restore')$('#backupFile').click()}function archiveMonth(m){let a=allStats(m);state.archives[m]={month:m,savedAt:new Date().toLocaleString(),creatorCount:state.creators.length,diamonds:a.diamonds,qualified:a.qualified,salary:a.salary,settings:JSON.parse(JSON.stringify(state.settings)),creators:JSON.parse(JSON.stringify(state.creators)),recruiters:JSON.parse(JSON.stringify(state.recruiters)),stats:JSON.parse(JSON.stringify(state.stats)),rewards:JSON.parse(JSON.stringify(state.rewards))};save()}let modalType='',editingId=null;function openModal(type,id=null){modalType=type;editingId=id;let item=type==='creator'?state.creators.find(x=>x.id===id):type==='recruiter'?state.recruiters.find(x=>x.id===id):null;$('#modalTitle').textContent=(id?'Edit ':'Add ')+({creator:'Creator',recruiter:'Recruiter',stats:'Monthly Statistics'}[type]);$('#modalSub').textContent=type==='stats'?`Update ${creatorName(state.creators.find(c=>c.id===id)||{})} for ${monthLabel(state.month)}.`:'Records save in this browser only in this starter version.';let fields=[];const field=(name,label,val='',kind='text',opts=null)=>fields.push({name,label,val,kind,opts});if(type==='creator'){field('name','Creator display name',item?.name||'');field('liveId','LiveMe ID',item?.liveId||'');field('recruiterId','Assigned recruiter',item?.recruiterId||'','select',[{value:'',label:'Unassigned'},...state.recruiters.map(r=>({value:r.id,label:r.name}))]);field('active','Status',item?.active===false?'inactive':'active','select',[{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}]);field('notes','Notes',item?.notes||'','textarea')}else if(type==='recruiter'){field('name','Recruiter name',item?.name||'');field('username','Recruiter username / ID',item?.username||'');field('contact','Contact (optional)',item?.contact||'');field('active','Status',item?.active===false?'inactive':'active','select',[{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}])}else{let s=statsFor(id);field('days','Effective days',s.days,'number');field('hours','Broadcast hours',s.hours,'number');field('diamonds','Diamonds',s.diamonds,'number')}$('#formFields').innerHTML=fields.map(f=>`<label class="field ${f.kind==='textarea'?'full':''}">${f.label}${f.kind==='select'?`<select name="${f.name}">${f.opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.val)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:f.kind==='textarea'?`<textarea name="${f.name}" rows="3">${esc(f.val)}</textarea>`:`<input name="${f.name}" type="${f.kind}" value="${esc(f.val)}" ${f.kind==='number'?'min="0" step="any"':''} ${['name','days','hours','diamonds'].includes(f.name)?'required':''}>`}</label>`).join('');$('#modalBack').classList.add('open')}function closeModal(){$('#modalBack').classList.remove('open')}$('#cancelModal').onclick=closeModal;$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});function saveModal(e){e.preventDefault();let f=new FormData(e.target);if(modalType==='creator'){let c=editingId?state.creators.find(x=>x.id===editingId):{id:uid(),createdAt:new Date().toISOString()};c.name=String(f.get('name')||'').trim();c.liveId=String(f.get('liveId')||'').trim();c.recruiterId=String(f.get('recruiterId')||'');c.active=f.get('active')!=='inactive';c.notes=String(f.get('notes')||'');if(!editingId)state.creators.push(c)}else if(modalType==='recruiter'){let r=editingId?state.recruiters.find(x=>x.id===editingId):{id:uid(),createdAt:new Date().toISOString()};r.name=String(f.get('name')||'').trim();r.username=String(f.get('username')||'').trim();r.contact=String(f.get('contact')||'').trim();r.active=f.get('active')!=='inactive';if(!editingId)state.recruiters.push(r)}else{state.stats[`${state.month}:${editingId}`]={days:Number(f.get('days'))||0,hours:Number(f.get('hours'))||0,diamonds:Number(f.get('diamonds'))||0}}save();closeModal();render()}function exportCSV(){let rows=[['Creator','LiveMe ID','Recruiter','Month','Days','Hours','Diamonds','Qualified','Estimated Agency Salary']];state.creators.forEach(c=>{let s=statsFor(c.id);rows.push([creatorName(c),c.liveId||'',assigned(c)?.name||'',state.month,s.days,s.hours,s.diamonds,qualified(c.id)?'Yes':'No',creatorSalary(c)])});let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,'live-hq-'+state.month+'.csv','text/csv')}function backup(){download(JSON.stringify({...state,backupCreatedAt:new Date().toISOString()},null,2),'live-hq-backup-'+state.month+'.json','application/json')}function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}$('#backupFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let s=JSON.parse(await file.text());if(!s.recruiters||!s.creators||!s.settings)throw Error('Invalid backup');if(confirm('Replace current browser records with this backup?')){state={...state,...s,demo:false};save();render();alert('Backup imported.')}}catch(err){alert('That backup file could not be read.')}e.target.value=''});load();render();})();
